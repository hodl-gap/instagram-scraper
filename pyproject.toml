[project]
name = "instagram_scraper"
version = "0.1.0"
description = "Standalone Instagram scraper (user posts + hashtag feeds) via instagrapi"
requires-python = ">=3.10"
dependencies = ["instagrapi"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
